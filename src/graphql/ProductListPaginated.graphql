query ProductListPaginated($first: Int!, $after: String, $channel: String!, $sortBy: ProductOrder) {
    products(first: $first, after: $after, channel: $channel, sortBy: $sortBy) {
		totalCount
		edges {
			node {
				...ProductListItem
			}
			cursor
		}
		pageInfo {
			endCursor
			hasNextPage
		}
	}
}
