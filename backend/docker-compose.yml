  #     - mongodb
  #     - qdrant
  #   env_file: .env

  qdrant:
    image: qdrant/qdrant:latest
    network_mode: "host"
    ports:
      - "6333:6333" # HTTP port
      - "6334:6334" # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_CORS=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # product_loader:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   network_mode: "host"
  #   depends_on:
  #     - qdrant
  #   command: uv run python -m scripts.load_products_to_qdrant
  #   env_file: .env

  mongodb:
    image: mongo:latest
    network_mode: "host"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    network_mode: "host"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  neo4j:
    image: neo4j:5.15-community
    network_mode: "host"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    depends_on:
      - redis
      - mongodb
      - neo4j
    command: uv run celery -A backend.infrastructure.celery_app worker --loglevel=info --queues=memory_consolidation,memory_processing,memory_cleanup
    env_file: .env

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "host"
    depends_on:
      - redis
      - mongodb
      - neo4j
    command: uv run celery -A backend.infrastructure.celery_app beat --loglevel=info
    env_file: .env

volumes:
  qdrant_data:
  mongodb_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
