<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>WebSocket Connection Test</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 20px;
			}
			.container {
				max-width: 800px;
				margin: 0 auto;
			}
			.status {
				padding: 10px;
				margin: 10px 0;
				border-radius: 5px;
			}
			.connected {
				background-color: #d4edda;
				color: #155724;
			}
			.disconnected {
				background-color: #f8d7da;
				color: #721c24;
			}
			.message {
				background-color: #f8f9fa;
				padding: 10px;
				margin: 5px 0;
				border-radius: 5px;
			}
			.log {
				background-color: #f8f9fa;
				padding: 10px;
				margin: 10px 0;
				border-radius: 5px;
				height: 300px;
				overflow-y: auto;
			}
			button {
				padding: 8px 16px;
				margin: 5px;
			}
			input {
				padding: 8px;
				margin: 5px;
				width: 300px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>WebSocket Connection Test</h1>

			<div id="status" class="status disconnected">Disconnected</div>

			<div>
				<label>Session ID:</label>
				<input type="text" id="sessionId" value="test_session_123" />
				<button onclick="connect()">Connect</button>
				<button onclick="disconnect()">Disconnect</button>
			</div>

			<div>
				<label>Message:</label>
				<input type="text" id="messageInput" placeholder="Enter message..." />
				<button onclick="sendMessage()">Send Message</button>
			</div>

			<div>
				<button onclick="sendPing()">Send Ping</button>
				<button onclick="testSession()">Test Session</button>
			</div>

			<h3>Messages:</h3>
			<div id="messages" class="log"></div>

			<h3>Debug Log:</h3>
			<div id="log" class="log"></div>
		</div>

		<script>
			let ws = null;

			function updateStatus(connected) {
				const status = document.getElementById("status");
				if (connected) {
					status.textContent = "Connected";
					status.className = "status connected";
				} else {
					status.textContent = "Disconnected";
					status.className = "status disconnected";
				}
			}

			function addMessage(message, type = "info") {
				const messages = document.getElementById("messages");
				const div = document.createElement("div");
				div.className = "message";
				div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
				messages.appendChild(div);
				messages.scrollTop = messages.scrollHeight;
			}

			function addLog(message) {
				const log = document.getElementById("log");
				const div = document.createElement("div");
				div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
				log.appendChild(div);
				log.scrollTop = log.scrollHeight;
			}

			function connect() {
				const sessionId = document.getElementById("sessionId").value;
				const url = `ws://localhost:4003/v1/sessions/${sessionId}/ws`;

				addLog(`Connecting to: ${url}`);

				try {
					ws = new WebSocket(url);

					ws.onopen = function (event) {
						addLog("WebSocket connected");
						updateStatus(true);
						addMessage("Connected to WebSocket");
					};

					ws.onmessage = function (event) {
						addLog(`Received: ${event.data}`);
						try {
							const data = JSON.parse(event.data);
							addMessage(`Message: ${JSON.stringify(data, null, 2)}`);
						} catch (e) {
							addMessage(`Raw message: ${event.data}`);
						}
					};

					ws.onclose = function (event) {
						addLog(`WebSocket closed: ${event.code} - ${event.reason}`);
						updateStatus(false);
						addMessage("WebSocket disconnected");
					};

					ws.onerror = function (error) {
						addLog(`WebSocket error: ${error}`);
						addMessage("WebSocket error occurred");
					};
				} catch (error) {
					addLog(`Connection error: ${error}`);
					addMessage("Failed to connect");
				}
			}

			function disconnect() {
				if (ws) {
					ws.close();
					ws = null;
				}
			}

			function sendMessage() {
				const input = document.getElementById("messageInput");
				const message = input.value.trim();
				if (message && ws && ws.readyState === WebSocket.OPEN) {
					const data = {
						type: "message",
						content: message,
						user_id: "vivek_001",
						referenced_product_ids: [],
					};
					ws.send(JSON.stringify(data));
					addLog(`Sent message: ${JSON.stringify(data)}`);
					input.value = "";
				} else if (!ws || ws.readyState !== WebSocket.OPEN) {
					addMessage("WebSocket not connected");
				}
			}

			function sendPing() {
				if (ws && ws.readyState === WebSocket.OPEN) {
					const data = {
						type: "ping",
						timestamp: new Date().toISOString(),
					};
					ws.send(JSON.stringify(data));
					addLog(`Sent ping: ${JSON.stringify(data)}`);
				} else {
					addMessage("WebSocket not connected");
				}
			}

			function testSession() {
				if (ws && ws.readyState === WebSocket.OPEN) {
					const data = {
						type: "message",
						content: "Hello, this is a test message!",
						user_id: "vivek_001",
						referenced_product_ids: [],
					};
					ws.send(JSON.stringify(data));
					addLog(`Sent test message: ${JSON.stringify(data)}`);
				} else {
					addMessage("WebSocket not connected");
				}
			}

			// Auto-connect on page load
			window.onload = function () {
				addLog("WebSocket test page loaded");
			};
		</script>
	</body>
</html>
