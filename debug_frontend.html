<!doctype html>
<html>
	<head>
		<title>CopilotKit Debug</title>
	</head>

	<body>
		<h1>CopilotKit Debug Test</h1>
		<div id="result"></div>

		<script>
			// Test the GraphQL endpoint directly from browser
			async function testCopilotKit() {
				const payload = {
					operationName: "generateCopilotResponse",
					query: `
                mutation generateCopilotResponse($data: GenerateCopilotResponseInput!) {
                    generateCopilotResponse(data: $data) {
                        threadId
                        runId
                        status {
                            code
                            __typename
                        }
                        messages {
                            __typename
                            ... on TextMessageOutput {
                                content
                                role
                                id
                                createdAt
                                status {
                                    code
                                    __typename
                                }
                            }
                        }
                        __typename
                    }
                }
                `,
					variables: {
						data: {
							messages: [
								{
									textMessage: {
										content: "hello test",
										role: "user",
									},
								},
							],
							threadId: "debug-test-123",
						},
					},
				};

				try {
					console.log("Sending request:", payload);

					const response = await fetch("http://localhost:8000/v1/chat/completions", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
						},
						body: JSON.stringify(payload),
					});

					console.log("Response status:", response.status);
					console.log("Response headers:", Object.fromEntries(response.headers.entries()));

					const data = await response.json();
					console.log("Response data:", data);

					document.getElementById("result").innerHTML = `
                    <h2>Response Status: ${response.status}</h2>
                    <h3>Response Data:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

					// Check if we got the expected structure
					if (data.data && data.data.generateCopilotResponse && data.data.generateCopilotResponse.messages) {
						const message = data.data.generateCopilotResponse.messages[0];
						if (message && message.content) {
							document.getElementById("result").innerHTML += `
                            <h3>✅ Success! Got message content:</h3>
                            <p><strong>${message.content}</strong></p>
                        `;
						}
					} else {
						document.getElementById("result").innerHTML += `
                        <h3>❌ Unexpected response structure</h3>
                    `;
					}
				} catch (error) {
					console.error("Error:", error);
					document.getElementById("result").innerHTML = `
                    <h2>❌ Error</h2>
                    <p>${error.message}</p>
                `;
				}
			}

			// Run test when page loads
			window.onload = testCopilotKit;
		</script>
	</body>
</html>
